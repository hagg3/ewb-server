# fail2ban filter — edenserver wrong-password attempts
#
# edenserver already throttles a single-IP password brute force itself
# (--auth-fail-limit: 5 tries / 60 s, then an escalating lockout enforced at
# accept()). This filter is the second layer: it moves the ban down to the OS
# firewall so a persistent guesser is dropped before the TCP handshake, and it
# lets you aggregate across restarts. It does NOT help against a distributed
# guesser — for that you want an allow-list, not a shared secret.
#
# Install: copy to /etc/fail2ban/filter.d/edenserver-auth.conf and enable the
# jail from ops/fail2ban/jail-edenserver.local. See ops/INSTALL.md §8.

[Definition]

# Matches: [Server] Rejected <name> from 203.0.113.7 (wrong password, 3 in window).
failregex = ^\[Server\] Rejected .+ from <HOST> \(wrong password

ignoreregex =

# journald backend: edenserver logs to stdout -> the systemd journal.
journalmatch = _SYSTEMD_UNIT=edenserver.service
